services:
  research-librarian:
    image: sustainable-catalyst-research-librarian:9.1.0
    container_name: sc-research-librarian
    restart: unless-stopped
    env_file:
      - .env.contabo
    environment:
      PORT: "8093"
      SC_RL_RELEASE_VERSION: "9.1.0"
      SC_RL_CORE_ENABLED: "${SC_RL_CORE_ENABLED:-true}"
      SC_RL_CORE_BASE_URL: "${SC_RL_CORE_BASE_URL:-http://sc-core:8090}"
      SC_RL_CORE_MINIMUM_VERSION: "${SC_RL_CORE_MINIMUM_VERSION:-3.3.0}"
      SC_RL_CORE_SUPPORTED_MAJOR: "${SC_RL_CORE_SUPPORTED_MAJOR:-3}"
      SC_RL_ASYNC_JOBS_ENABLED: "${SC_RL_ASYNC_JOBS_ENABLED:-true}"
      SC_RL_ASYNC_JOB_POLL_SECONDS: "${SC_RL_ASYNC_JOB_POLL_SECONDS:-1.0}"
      SC_RL_ASYNC_JOB_LEASE_SECONDS: "${SC_RL_ASYNC_JOB_LEASE_SECONDS:-120}"
      SC_RL_ASYNC_JOB_RECLAIM_INTERVAL_SECONDS: "${SC_RL_ASYNC_JOB_RECLAIM_INTERVAL_SECONDS:-60}"
      SC_RL_ASYNC_JOB_RETRY_BASE_SECONDS: "${SC_RL_ASYNC_JOB_RETRY_BASE_SECONDS:-5.0}"
      SC_RL_ASYNC_JOB_RETRY_MAX_SECONDS: "${SC_RL_ASYNC_JOB_RETRY_MAX_SECONDS:-900}"
    ports:
      - "127.0.0.1:8093:8093"
    volumes:
      - research_librarian_data:/var/data
    networks:
      - sc-internal

volumes:
  research_librarian_data:

networks:
  sc-internal:
    external: true
